<!DOCTYPE html>
<html lang="it" manifest="segnapunti.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Segnapunti">
<title>Segnapunti Pallavolo</title>
<style>
input,select,textarea{-webkit-user-select:text;user-select:text}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Arial,sans-serif;background:#111}
#app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#board{flex:1;display:flex;min-height:0}
.team{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;min-width:0}
.team{overflow:hidden}
.name{flex-shrink:0;font-size:9vw;font-weight:800;text-transform:uppercase;letter-spacing:.04em;max-width:100%;text-align:center;line-height:1.05;word-break:normal;overflow:hidden}
.bg{position:absolute;top:0;left:0;right:0;bottom:0;z-index:0;opacity:.3;background-repeat:no-repeat;background-position:center;background-size:contain}
.name,.sets,.to{position:relative;z-index:1}
.sc{display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.tc{display:inline-block;width:1.1em;height:1.1em;border-radius:50%;border:3px solid currentColor;margin:0 4px}
.tc.on{background:currentColor}
.score{font-size:30vh;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.to{display:flex;align-items:center;margin-top:4px;font-size:22px;font-weight:700}
.tob{font:inherit;font-size:18px;font-weight:700;padding:8px 12px;border-radius:10px;border:2px solid currentColor;background:transparent;color:inherit}
.tob:disabled{opacity:.3}
.tv .tob{display:none}
#timer{position:fixed;top:0;left:0;right:0;bottom:0;z-index:35;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center}
#tn{margin-bottom:10px;font-size:6vw;font-weight:800;text-transform:uppercase}
#tc{font-size:55vh;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
#tx{font-size:20px;padding:12px 26px;border-radius:12px;border:2px solid currentColor;background:transparent;color:inherit}
.sw button,.lgrow button{font:inherit;padding:8px 12px;border-radius:8px;border:0;background:#333;color:#fff}
.sets{display:flex;margin-top:6px;align-items:center;font-size:3.5vw;font-weight:700}
.dot{width:1.1em;height:1.1em;border-radius:50%;border:3px solid currentColor}
.dot.on{background:currentColor}
.serve{display:block;width:60px;height:60px;flex-shrink:0;opacity:0;margin-right:2vw}
.serve svg{display:block;width:100%;height:100%}
.serve.on{opacity:1}
.minus{position:absolute;bottom:10px;right:10px;width:48px;height:48px;border-radius:50%;border:2px solid currentColor;background:transparent;color:inherit;font-size:28px;line-height:1;opacity:.6}
#center{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;font-size:14px;color:#fff;background:rgba(0,0,0,0.53);padding:4px 12px;border-radius:99px;pointer-events:none;top:auto;bottom:70px}
#bar{display:flex;flex-wrap:wrap;justify-content:center;padding:8px;background:#000}
#bar button,.panel button{font:inherit;font-size:15px;padding:10px 14px;border-radius:10px;border:0;background:#333;color:#fff}
#bar button.p{background:#2563eb}
.tv #bar{display:none}
.tv .minus{display:none}
#reveal{position:fixed;top:0;right:0;width:60px;height:60px;z-index:20}
#banner{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.80);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:30;color:#fff;text-align:center;padding:20px}
#banner h2{font-size:7vw;margin:0 0 18px}
#banner button{font-size:22px;padding:14px 28px;border-radius:12px;border:0;background:#22c55e;color:#fff}
.panel{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.87);display:none;z-index:40;overflow:auto;padding:16px;color:#fff}
.panel .box{max-width:520px;margin:auto;background:#1f1f1f;border-radius:16px;padding:18px}.panel .box>*{margin-bottom:12px}
.panel h3{margin:0}
.panel label{display:flex;flex-direction:column;font-size:14px;opacity:.9}
.panel input[type=text],.panel input[type=number],.panel select{font:inherit;font-size:17px;padding:10px;border-radius:8px;border:1px solid #555;background:#111;color:#fff}
.sw{display:flex;flex-wrap:wrap;align-items:center}.sw>*{margin:4px 8px 4px 0}
.sw i{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,0.40);display:inline-block}
.sw input[type=color]{width:44px;height:38px;padding:0;border:0;background:none}
.row{display:flex}.row>*{flex:1;margin-right:12px}.row>*:last-child{margin-right:0}
.to>*{margin:0 6px}.sets .dot{margin-left:8px}.panel label>*{margin-top:6px}#bar button{margin:4px}
.sw i,.tob,#bar button,.team{cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none}
.lbl{display:flex;flex-direction:column;font-size:14px;opacity:.9}.lbl>*{margin-top:6px}
@media (orientation:portrait){#board{flex-direction:column}.score{font-size:20vh}.name{font-size:10vw}}
</style>
</head>
<body>
<div id="app">
  <div id="board">
    <div class="team" id="t0"><div class="bg"></div><div class="name"></div><div class="sc"><span class="serve" id="s0"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="bc0"><circle cx="50" cy="50" r="47"/></clipPath></defs><g clip-path="url(#bc0)"><rect width="100" height="100" fill="#ffd400"/><path d="M-10 24 Q50 2 110 26 L110 48 Q50 26 -10 48Z" fill="#1f4fb5"/><path d="M-10 60 Q50 38 110 62 L110 86 Q50 64 -10 86Z" fill="#1f4fb5"/><path d="M-5 50 Q50 34 105 52" fill="none" stroke="#0a2a66" stroke-width="2"/><path d="M32 -5 Q52 50 30 105" fill="none" stroke="#0a2a66" stroke-width="2"/><path d="M70 -5 Q50 50 72 105" fill="none" stroke="#0a2a66" stroke-width="2"/></g><circle cx="50" cy="50" r="47" fill="none" stroke="#111" stroke-width="3"/></svg></span><div class="score">0</div></div><div class="sets"></div><div class="to"><button class="tob">⏱ TIMEOUT</button><span class="td"></span></div><button class="minus" aria-label="Togli un punto">−</button></div>
    <div class="team" id="t1"><div class="bg"></div><div class="name"></div><div class="sc"><span class="serve" id="s1"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="bc1"><circle cx="50" cy="50" r="47"/></clipPath></defs><g clip-path="url(#bc1)"><rect width="100" height="100" fill="#ffd400"/><path d="M-10 24 Q50 2 110 26 L110 48 Q50 26 -10 48Z" fill="#1f4fb5"/><path d="M-10 60 Q50 38 110 62 L110 86 Q50 64 -10 86Z" fill="#1f4fb5"/><path d="M-5 50 Q50 34 105 52" fill="none" stroke="#0a2a66" stroke-width="2"/><path d="M32 -5 Q52 50 30 105" fill="none" stroke="#0a2a66" stroke-width="2"/><path d="M70 -5 Q50 50 72 105" fill="none" stroke="#0a2a66" stroke-width="2"/></g><circle cx="50" cy="50" r="47" fill="none" stroke="#111" stroke-width="3"/></svg></span><div class="score">0</div></div><div class="sets"></div><div class="to"><button class="tob">⏱ TIMEOUT</button><span class="td"></span></div><button class="minus" aria-label="Togli un punto">−</button></div>
  </div>
  <div id="bar">
    <button id="bUndo">↩ Annulla</button>
    <button id="bServe">🏐 Servizio</button>
    <button id="bSwap">⇄ Cambio campo</button>
    <button id="bSet" class="p">⚙ Impostazioni</button>
    <button id="bFull">⛶ Schermo intero</button>
    <button id="bTv" class="p">📺 Modalità TV</button>
  </div>
</div>
<div id="reveal"></div>
<div id="timer"><div id="tn"></div><div id="tc">30</div><button id="tx">Chiudi</button></div>
<div id="banner"><h2 id="bt"></h2><button id="bOk">Continua</button></div>

<div class="panel" id="panel"><div class="box">
  <h3>Impostazioni</h3>
  <div class="row">
    <label>Squadra A<input type="text" id="n0" maxlength="20"></label>
    <label>Squadra B<input type="text" id="n1" maxlength="20"></label>
  </div>
  <div class="lbl">Colore squadra A<div class="sw" id="sw0"></div></div>
  <div class="lbl">Colore squadra B<div class="sw" id="sw1"></div></div>
  <div class="lbl">Colore punteggio e nome squadra A<div class="sw" id="fw0"></div></div>
  <div class="lbl">Colore punteggio e nome squadra B<div class="sw" id="fw1"></div></div>
  <div class="row">
    <label>Grandezza nomi<select id="ns"><option value="0.7">Piccola</option><option value="1">Media</option><option value="1.4">Grande</option><option value="1.8">Molto grande</option><option value="2.4">Enorme</option><option value="3.2">Gigante</option></select></label>
    <label>Stile nomi<select id="nf"><option value="sans">Normale</option><option value="cond">Condensato (più stretto)</option><option value="black">Extra nero</option><option value="serif">Con grazie</option><option value="mono">Macchina da scrivere</option></select></label>
  </div>
  <label>Grandezza punteggio<select id="ss"><option value="0.8">Piccola</option><option value="1">Media</option><option value="1.2">Grande</option><option value="1.4">Molto grande</option></select></label>
  <label>Maiuscole<select id="nu"><option value="upper">TUTTO MAIUSCOLO</option><option value="none">Come scritto</option></select></label>
  <label>Logo squadra A<div class="sw lgrow"><input type="file" accept="image/*" id="lg0"><button id="lx0">Rimuovi</button></div></label>
  <label>Logo squadra B<div class="sw lgrow"><input type="file" accept="image/*" id="lg1"><button id="lx1">Rimuovi</button></div></label>
  <label>Logo come sfondo<select id="lf"><option value="contain">Intero (adattato)</option><option value="cover">Riempi tutto (può tagliare)</option></select></label>
  <label>Durata timeout (secondi)<input type="number" id="tod" min="10" max="120"></label>
  <div class="row">
    <label>Punti per set<input type="number" id="tg" min="5" max="50"></label>
    <label>Punti set decisivo<input type="number" id="tt" min="5" max="50"></label>
  </div>
  <label>Formato partita
    <select id="bo"><option value="3">Al meglio dei 3 set</option><option value="5">Al meglio dei 5 set</option></select>
  </label>
  <div class="row">
    <button id="bNew">Nuova partita</button>
    <button id="bClose" class="p">Chiudi</button>
  </div>
</div></div>

<script>
(function(){
var PRESETS=['#e53935','#1e88e5','#43a047','#fdd835','#fb8c00','#8e24aa','#00acc1','#111111','#ffffff'];
var KEY='segnapunti-pallavolo-v1';
function fresh(){return{teams:[{name:'Casa',color:'#e53935',fg:'',score:0,sets:0,logo:'',to:0},{name:'Ospiti',color:'#1e88e5',fg:'',score:0,sets:0,logo:'',to:0}],serve:0,setNo:1,target:25,tie:15,bestOf:5,toDur:30,logoFit:'contain',nameScale:1,nameFont:'cond',nameUp:'upper',scoreScale:1,pending:-1,over:-1,history:[]}}
var S=fresh();
try{var raw=localStorage.getItem(KEY);if(raw){S=Object.assign(fresh(),JSON.parse(raw))}}catch(e){}
try{var lgs=JSON.parse(localStorage.getItem(KEY+'-logos')||'null');if(lgs){S.teams[0].logo=lgs[0]||'';S.teams[1].logo=lgs[1]||''}}catch(e){}
function save(){try{var c=Object.assign({},S);c.history=[];c.teams=S.teams.map(function(t){var o={};for(var k in t)o[k]=t[k];o.logo='';return o});localStorage.setItem(KEY,JSON.stringify(c))}catch(e){}}
function saveLogos(){try{localStorage.setItem(KEY+'-logos',JSON.stringify([S.teams[0].logo,S.teams[1].logo]))}catch(e){}}
function snap(){var h=S.history,lg=[S.teams[0].logo,S.teams[1].logo];S.history=[];S.teams[0].logo='';S.teams[1].logo='';var c=JSON.parse(JSON.stringify(S));S.teams[0].logo=lg[0];S.teams[1].logo=lg[1];S.history=h;h.push(c);if(h.length>200)h.shift()}
function $(id){return document.getElementById(id)}
function lum(h){var r=parseInt(h.substr(1,2),16),g=parseInt(h.substr(3,2),16),b=parseInt(h.substr(5,2),16);return(.299*r+.587*g+.114*b)/255}
function rgba(h,a){return 'rgba('+parseInt(h.substr(1,2),16)+','+parseInt(h.substr(3,2),16)+','+parseInt(h.substr(5,2),16)+','+a+')'}
function fgOf(t){return t.fg||(lum(t.color)>.6?'#111':'#fff')}
function render(){
  var need=Math.ceil(S.bestOf/2);
  for(var i=0;i<2;i++){
    var t=S.teams[i],el=$('t'+i);
    el.style.background=t.color;
    el.style.color=fgOf(t);
    el.querySelector('.name').textContent=t.name;
    el.querySelector('.score').textContent=t.score;
    var bg=el.querySelector('.bg'),key=(t.logo?t.logo.length+t.logo.slice(-24):'0')+'|'+(S.logoFit||'contain');
    if(bg._k!==key){bg._k=key;bg.style.backgroundImage=t.logo?'url("'+t.logo+'")':'none';bg.style.backgroundSize=S.logoFit||'contain'}
    var used=t.to||0,hh='';
    for(var q=0;q<2;q++)hh+='<span class="tc'+(q<used?' on':'')+'"></span>';
    el.querySelector('.td').innerHTML=hh;
    el.querySelector('.tob').disabled=used>=2;
    var d='';for(var k=0;k<need;k++)d+='<span class="dot'+(k<t.sets?' on':'')+'"></span>';
    el.querySelector('.sets').innerHTML='SET '+d;
    $('s'+i).className='serve'+(S.serve===i?' on':'');
  }
  fit();save();
}
function layout(){
  // ordine visivo: se swapped, scambia gli elementi nel DOM
  var b=$('board');
  if(S.swapped){b.appendChild($('t0'))}else{b.appendChild($('t1'))}
}
var FONTS={sans:'',cond:'"DIN Condensed","Avenir Next Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow",Impact,sans-serif',black:'"Arial Black",Arial,sans-serif',serif:'Georgia,"Droid Serif",serif',mono:'"Courier New","Droid Sans Mono",monospace'};
function fit(){
  var W=window.innerWidth,H=window.innerHeight,port=H>W,sc=S.nameScale||1,f=S.nameFont||'sans',up=S.nameUp||'upper';
  var bh=$('board').clientHeight,ph=port?bh/2:bh;
  var ss=S.scoreScale||1,pw=port?W:W/2,sp=Math.round(Math.max(50,Math.min((port?H*.2:H*.3)*ss,H*.42,pw*.95/2,(ph-H*.12-100)/1.1)));
  for(var j=0;j<2;j++){var te=$('t'+j),sc2=te.querySelector('.score'),sv=te.querySelector('.serve');
    if(sc2._sp!==sp){sc2._sp=sp;sc2.style.fontSize=sp+'px';sv.style.width=sv.style.height=Math.round(sp*.62)+'px'}}
  for(var i=0;i<2;i++){
    var n=$('t'+i).querySelector('.name'),k=S.teams[i].name+'|'+W+'x'+H+'|'+bh+'|'+sc+f+up+'|'+sp;
    if(n._k===k)continue;
    n._k=k;
    n.style.fontFamily=FONTS[f]||'';
    n.style.fontWeight=f==='black'?'900':'800';
    n.style.letterSpacing=f==='cond'?'0':'.02em';
    n.style.textTransform=up==='upper'?'uppercase':'none';
    n.style.maxHeight=Math.round(Math.max(H*.12,Math.min(H*(port?.3:.5),ph-sp*1.1-110)))+'px';
    var px=Math.round((port?Math.min(W*.11,H*.08):Math.min(W*.09,H*.14))*sc);
    n.style.fontSize=px+'px';
    while(px>16&&(n.scrollHeight>n.clientHeight+1||n.scrollWidth>n.clientWidth+1)){px-=2;n.style.fontSize=px+'px'}
  }
}
function target(){return S.setNo===S.bestOf?S.tie:S.target}
function check(){
  var a=S.teams[0].score,b=S.teams[1].score,g=target();
  var w=-1;
  if(a>=g&&a-b>=2)w=0;else if(b>=g&&b-a>=2)w=1;
  if(w>=0){
    S.pending=w;
    var need=Math.ceil(S.bestOf/2),fin=S.teams[w].sets+1>=need;
    $('bt').textContent=fin?'🏆 Vince '+S.teams[w].name+'!':'Set a '+S.teams[w].name;
    $('bOk').textContent=fin?'Nuova partita':'Prossimo set';
    $('banner').style.display='flex';
    $('banner').style.background=rgba(S.teams[w].color,.93);
    $('banner').style.color=fgOf(S.teams[w]);
  }
}
function add(i,d){
  if(S.pending>=0)return;
  var t=S.teams[i];
  if(d<0&&t.score===0)return;
  snap();t.score+=d;
  if(d>0)S.serve=i;
  render();if(d>0)check();
}
$('banner').onclick=null;
$('bOk').onclick=function(e){
  e.stopPropagation();
  var w=S.pending;if(w<0)return;
  var need=Math.ceil(S.bestOf/2);
  S.teams[w].sets++;
  if(S.teams[w].sets>=need){newMatch(true);}
  else{
    snap();S.history.pop(); // evita undo oltre il set
    S.teams[0].to=0;S.teams[1].to=0;S.teams[0].score=0;S.teams[1].score=0;S.setNo++;S.serve=1-w;S.pending=-1;S.history=[];
  }
  $('banner').style.display='none';render();
};
function newMatch(silent){
  var n=S.teams.map(function(t){return{name:t.name,color:t.color,score:0,sets:0,logo:t.logo||'',fg:t.fg||'',to:0}});
  var keep={target:S.target,tie:S.tie,bestOf:S.bestOf,swapped:S.swapped,toDur:S.toDur,logoFit:S.logoFit,nameScale:S.nameScale,nameFont:S.nameFont,nameUp:S.nameUp,scoreScale:S.scoreScale};
  S=fresh();S.teams=n;S.target=keep.target;S.tie=keep.tie;S.bestOf=keep.bestOf;S.swapped=keep.swapped;S.toDur=keep.toDur||30;S.logoFit=keep.logoFit||'contain';S.nameScale=keep.nameScale||1;S.nameFont=keep.nameFont||'sans';S.nameUp=keep.nameUp||'upper';S.scoreScale=keep.scoreScale||1;S.pending=-1;
  $('banner').style.display='none';render();
}
function inTo(n){while(n){if(n.classList&&n.classList.contains('to'))return true;n=n.parentNode}return false}
// tap sulle squadre
[0,1].forEach(function(i){
  var el=$('t'+i);
  el.addEventListener('click',function(e){if(e.target.classList.contains('minus')||inTo(e.target))return;add(i,1)});
  el.querySelector('.tob').addEventListener('click',function(e){e.stopPropagation();startTO(i)});
  el.querySelector('.minus').addEventListener('click',function(e){e.stopPropagation();add(i,-1)});
});
$('bUndo').onclick=function(){
  if(S.pending>=0){S.pending=-1;$('banner').style.display='none'}
  var p=S.history.pop();
  if(p){var h=S.history,lg=[S.teams[0].logo,S.teams[1].logo];S=p;S.history=h;S.teams[0].logo=lg[0];S.teams[1].logo=lg[1];render()}
};
$('bServe').onclick=function(){snap();S.serve=1-S.serve;render()};
$('bSwap').onclick=function(){S.swapped=!S.swapped;layout();render()};
function goFull(){
  var d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen||d.mozRequestFullScreen||d.msRequestFullscreen;
  if(!f)return false;
  try{var r=f.call(d);if(r&&r.catch)r.catch(function(){})}catch(e){return false}
  return true;
}
var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
$('bFull').onclick=function(){
  if(goFull())return;
  alert(isIOS?"Su iPad lo schermo intero si ottiene cosi: tocca il pulsante Condividi (quadrato con freccia), poi Aggiungi a Home, e apri il segnapunti dall'icona sulla schermata Home.":'Il browser non permette lo schermo intero da questa pagina. Apri il file direttamente in Chrome, poi dal menu ⋮ scegli Schermo intero se disponibile.');
};
if(window.navigator.standalone)$('bFull').style.display='none';
document.addEventListener('touchmove',function(e){if($('panel').style.display!=='block')e.preventDefault()},false);
$('bTv').onclick=function(){document.body.classList.add('tv');fit();goFull();wake()};
$('reveal').onclick=function(){document.body.classList.remove('tv');fit()};
// impostazioni
function sw(i){
  var box=$('sw'+i);box.innerHTML='';
  PRESETS.forEach(function(c){
    var s=document.createElement('i');s.style.background=c;
    s.onclick=function(){S.teams[i].color=c;render();sw(i)};
    box.appendChild(s);
  });
  var inp=document.createElement('input');inp.type='color';inp.value=S.teams[i].color;
  inp.oninput=function(){S.teams[i].color=inp.value;render()};
  box.appendChild(inp);
}
function fw(i){
  var box=$('fw'+i);box.innerHTML='';
  var a=document.createElement('button');a.textContent='Auto';
  a.onclick=function(){S.teams[i].fg='';render()};
  box.appendChild(a);
  PRESETS.forEach(function(c){var s=document.createElement('i');s.style.background=c;s.onclick=function(){S.teams[i].fg=c;render()};box.appendChild(s)});
  var inp=document.createElement('input');inp.type='color';inp.value=S.teams[i].fg||'#ffffff';
  inp.oninput=function(){S.teams[i].fg=inp.value;render()};
  box.appendChild(inp);
}
function openPanel(){
  $('n0').value=S.teams[0].name;$('n1').value=S.teams[1].name;
  $('tg').value=S.target;$('tt').value=S.tie;$('bo').value=S.bestOf;$('tod').value=S.toDur||30;$('lf').value=S.logoFit||'contain';$('ns').value=String(S.nameScale||1);$('nf').value=S.nameFont||'sans';$('nu').value=S.nameUp||'upper';$('ss').value=String(S.scoreScale||1);
  sw(0);sw(1);fw(0);fw(1);$('panel').style.display='block';
}
$('bSet').onclick=openPanel;
$('n0').oninput=function(){S.teams[0].name=this.value;render()};
$('n1').oninput=function(){S.teams[1].name=this.value;render()};
$('tg').onchange=function(){S.target=Math.max(5,+this.value||25);render()};
$('tt').onchange=function(){S.tie=Math.max(5,+this.value||15);render()};
$('bo').onchange=function(){S.bestOf=+this.value;render()};
$('bClose').onclick=function(){$('panel').style.display='none'};
$('bNew').onclick=function(){if(confirm('Azzerare punti e set?')){newMatch();$('panel').style.display='none'}};
// timeout con timer
var tInt=null,ac=null;
function beep(n){try{if(ac&&ac.state==='suspended')ac.resume();for(var k=0;k<n;k++){var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=.3;var s=ac.currentTime+k*.35;o.start(s);o.stop(s+.2)}}catch(e){}}
function closeTimer(){clearInterval(tInt);$('timer').style.display='none'}
function startTO(i){
  var t=S.teams[i];
  if(S.pending>=0||(t.to||0)>=2)return;
  snap();t.to=(t.to||0)+1;render();
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}
  var end=Date.now()+(S.toDur||30)*1000;
  $('tn').textContent='Timeout '+t.name;
  $('timer').style.background=t.color;
  $('timer').style.color=fgOf(t);
  $('timer').style.display='flex';
  clearInterval(tInt);
  function tick(){var r=Math.max(0,Math.ceil((end-Date.now())/1000));$('tc').textContent=r;if(r<=0){clearInterval(tInt);beep(3)}}
  tick();tInt=setInterval(tick,250);
}
$('tx').onclick=closeTimer;
// loghi
function setLogo(i,file){
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var sc=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    S.teams[i].logo=c.toDataURL('image/png');saveLogos();render()};im.src=r.result};
  r.readAsDataURL(file);
}
$('lg0').onchange=function(){if(this.files[0])setLogo(0,this.files[0])};
$('lg1').onchange=function(){if(this.files[0])setLogo(1,this.files[0])};
$('lx0').onclick=function(){S.teams[0].logo='';$('lg0').value='';saveLogos();render()};
$('lx1').onclick=function(){S.teams[1].logo='';$('lg1').value='';saveLogos();render()};
$('ns').onchange=function(){S.nameScale=+this.value;render()};
$('nf').onchange=function(){S.nameFont=this.value;render()};
$('ss').onchange=function(){S.scoreScale=+this.value;render()};
$('nu').onchange=function(){S.nameUp=this.value;render()};
$('lf').onchange=function(){S.logoFit=this.value;render()};
$('tod').onchange=function(){S.toDur=Math.min(120,Math.max(10,+this.value||30));render()};
window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,300)});
// schermo sempre acceso
var lock=null;
function wake(){try{if(navigator.wakeLock){navigator.wakeLock.request('screen').then(function(l){lock=l}).catch(function(){})}}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')wake()});
wake();
layout();render();
if(S.pending>=0){S.pending=-1;check()}
})();
</script>
</body>
